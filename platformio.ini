[platformio]
default_envs = esp32dev

; Firmware target.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
check_tool =
  cppcheck
check_skip_packages = yes
check_flags =
  cppcheck: --enable=warning,style,performance,portability --suppress=noExplicitConstructor
lib_deps =
  adafruit/Adafruit NeoPixel

; Host-side unit tests for the hardware-free modules (protocol parser,
; checksum, AQI contract and display timing). Run with:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<MatrixProtocol.cpp> +<AqiDisplay.cpp>
build_flags = -std=c++17 -Wall -Wextra
