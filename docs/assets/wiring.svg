<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="neoncore wiring diagram: 5V 2A PSU, ESP32 DevKit, 470 ohm resistor on GPIO4 data line, 4x4 WS2812B matrix, 1000 uF capacitor across VCC and GND">
  <title>neoncore wiring</title>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <rect id="px" width="24" height="24" rx="5" ry="5"/>
    <circle id="pin" r="2.4"/>
    <style>
      .ui   { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
      .t1   { fill: #e6edf3; }
      .t2   { fill: #8b949e; }
      .blk  { fill: #0d1117; stroke: #3b4552; stroke-width: 1.5; }
      .w5v  { stroke: #FF6B6B; }
      .wgnd { stroke: #8b949e; }
      .wdat { stroke: #6EE7F9; }
      .wire { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .pad  { fill: #d4a72c; stroke: #0b0f14; stroke-width: 1; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="520" fill="#0b0f14"/>

  <!-- header -->
  <text x="40" y="46" class="ui" font-size="22" font-weight="700" letter-spacing="0.5">
    <tspan class="t1">neoncore</tspan><tspan class="t2" font-weight="400" dx="10">/ wiring</tspan>
  </text>
  <text x="40" y="68" class="mono t2" font-size="12">ESP32 DevKit  ->  470 Ω  ->  WS2812B 4×4   ·   5 V / 2 A supply   ·   1000 µF bulk cap</text>

  <!-- ===== rails ===== -->
  <!-- +5V : PSU (+) up to top rail, across to capacitor -->
  <path class="wire w5v" d="M110,195 V100 H878"/>
  <!-- GND : PSU (-) down to bottom rail, across to capacitor -->
  <path class="wire wgnd" d="M110,345 V440 H878"/>
  <text x="400" y="91" class="mono" font-size="11" fill="#FF6B6B" text-anchor="middle">+5 V rail</text>
  <text x="400" y="457" class="mono" font-size="11" fill="#8b949e" text-anchor="middle">GND rail</text>

  <!-- ESP32 taps -->
  <path class="wire w5v" d="M300,100 V165"/>
  <path class="wire wgnd" d="M300,440 V375"/>
  <!-- matrix taps -->
  <path class="wire w5v" d="M615,100 V230 H640"/>
  <path class="wire wgnd" d="M615,440 V310 H640"/>
  <!-- junction dots -->
  <g fill="#FF6B6B">
    <circle cx="300" cy="100" r="3.6"/><circle cx="615" cy="100" r="3.6"/>
  </g>
  <g fill="#8b949e">
    <circle cx="300" cy="440" r="3.6"/><circle cx="615" cy="440" r="3.6"/>
  </g>

  <!-- pin labels on taps -->
  <text x="118" y="150" class="mono" font-size="11" fill="#FF6B6B">+5V</text>
  <text x="118" y="396" class="mono" font-size="11" fill="#8b949e">GND</text>
  <text x="308" y="140" class="mono" font-size="11" fill="#FF6B6B">VIN</text>
  <text x="308" y="412" class="mono" font-size="11" fill="#8b949e">GND</text>

  <!-- ===== DATA line ===== -->
  <path class="wire wdat" d="M490,270 H525"/>
  <path class="wire wdat" d="M585,270 H632"/>
  <!-- arrow head into DIN -->
  <path d="M628,264 L640,270 L628,276 Z" fill="#6EE7F9"/>
  <!-- resistor -->
  <rect x="525" y="262" width="60" height="16" rx="3" fill="#0b0f14" stroke="#6EE7F9" stroke-width="2"/>
  <text x="555" y="252" class="mono" font-size="11" fill="#6EE7F9" text-anchor="middle">R1  470 Ω</text>
  <text x="555" y="296" class="mono" font-size="10" fill="#8b949e" text-anchor="middle">series, close to DIN</text>

  <!-- ===== PSU block ===== -->
  <rect x="40" y="195" width="140" height="150" rx="10" class="blk"/>
  <text x="110" y="238" class="ui t1" font-size="15" font-weight="600" text-anchor="middle">PSU</text>
  <text x="110" y="262" class="mono t1" font-size="13" text-anchor="middle">5 V / 2 A</text>
  <text x="110" y="282" class="mono t2" font-size="10.5" text-anchor="middle">regulated DC</text>
  <text x="110" y="318" class="mono t2" font-size="10" text-anchor="middle">16 LEDs × 60 mA ≈ 1 A</text>
  <text x="110" y="209" class="mono" font-size="12" fill="#FF6B6B" text-anchor="middle" dominant-baseline="hanging">+</text>
  <text x="110" y="338" class="mono" font-size="14" fill="#8b949e" text-anchor="middle">−</text>

  <!-- ===== ESP32 block ===== -->
  <rect x="270" y="165" width="220" height="210" rx="10" class="blk"/>
  <text x="380" y="192" class="ui t1" font-size="15" font-weight="600" text-anchor="middle">ESP32 DevKit</text>
  <!-- header pins -->
  <g fill="#3b4552">
    <use xlink:href="#pin" x="280" y="218"/><use xlink:href="#pin" x="280" y="231"/><use xlink:href="#pin" x="280" y="244"/><use xlink:href="#pin" x="280" y="257"/>
    <use xlink:href="#pin" x="280" y="270"/><use xlink:href="#pin" x="280" y="283"/><use xlink:href="#pin" x="280" y="296"/><use xlink:href="#pin" x="280" y="309"/>
    <use xlink:href="#pin" x="480" y="218"/><use xlink:href="#pin" x="480" y="231"/><use xlink:href="#pin" x="480" y="244"/><use xlink:href="#pin" x="480" y="257"/>
    <use xlink:href="#pin" x="480" y="283"/><use xlink:href="#pin" x="480" y="296"/><use xlink:href="#pin" x="480" y="309"/>
  </g>
  <!-- chip -->
  <rect x="345" y="222" width="70" height="70" rx="6" fill="#161b22" stroke="#3b4552" stroke-width="1.2"/>
  <rect x="352" y="229" width="56" height="56" rx="3" fill="none" stroke="#2a313a" stroke-width="1"/>
  <text x="380" y="253" class="ui t1" font-size="11" font-weight="700" text-anchor="middle">ESP32</text>
  <text x="380" y="270" class="mono t2" font-size="8.5" text-anchor="middle">WROOM-32</text>
  <!-- antenna zigzag -->
  <path d="M300,232 l8,-6 l0,12 l8,-12 l0,12 l8,-12 l0,12 l6,-6" fill="none" stroke="#3b4552" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- GPIO4 -->
  <circle cx="480" cy="270" r="3.6" fill="#6EE7F9"/>
  <text x="472" y="274" class="mono" font-size="11" fill="#6EE7F9" text-anchor="end">GPIO4</text>
  <!-- warning -->
  <path d="M292,344 l7,-12 l7,12 z" fill="none" stroke="#FFD200" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="298.4" y="336" width="1.4" height="4" fill="#FFD200"/><rect x="298.4" y="341.5" width="1.4" height="1.4" fill="#FFD200"/>
  <text x="310" y="343" class="mono" font-size="10.5" fill="#FFD200">do NOT power LEDs from the</text>
  <text x="310" y="358" class="mono" font-size="10.5" fill="#FFD200">ESP32 5V / 3V3 pin</text>

  <!-- ===== WS2812B matrix block ===== -->
  <rect x="640" y="165" width="200" height="210" rx="10" class="blk"/>
  <text x="746" y="192" class="ui t1" font-size="15" font-weight="600" text-anchor="middle">WS2812B 4×4</text>
  <!-- pads -->
  <rect x="636" y="226" width="8" height="8" class="pad"/>
  <rect x="636" y="266" width="8" height="8" class="pad"/>
  <rect x="636" y="306" width="8" height="8" class="pad"/>
  <text x="651" y="234" class="mono" font-size="11" fill="#FF6B6B">VCC</text>
  <text x="651" y="274" class="mono" font-size="11" fill="#6EE7F9">DIN</text>
  <text x="651" y="314" class="mono" font-size="11" fill="#8b949e">GND</text>
  <!-- LED grid: glow layer -->
  <g fill="#96B4FF" opacity="0.7" filter="url(#glow)">
    <use xlink:href="#px" x="706" y="213"/><use xlink:href="#px" x="736" y="213"/><use xlink:href="#px" x="766" y="213"/><use xlink:href="#px" x="796" y="213"/>
    <use xlink:href="#px" x="706" y="243"/><use xlink:href="#px" x="736" y="243"/><use xlink:href="#px" x="766" y="243"/><use xlink:href="#px" x="796" y="243"/>
    <use xlink:href="#px" x="706" y="273"/><use xlink:href="#px" x="736" y="273"/><use xlink:href="#px" x="766" y="273"/><use xlink:href="#px" x="796" y="273"/>
    <use xlink:href="#px" x="706" y="303"/><use xlink:href="#px" x="736" y="303"/><use xlink:href="#px" x="766" y="303"/><use xlink:href="#px" x="796" y="303"/>
  </g>
  <!-- LED grid: crisp layer -->
  <g fill="#96B4FF">
    <use xlink:href="#px" x="706" y="213"/><use xlink:href="#px" x="736" y="213"/><use xlink:href="#px" x="766" y="213"/><use xlink:href="#px" x="796" y="213"/>
    <use xlink:href="#px" x="706" y="243"/><use xlink:href="#px" x="736" y="243"/><use xlink:href="#px" x="766" y="243"/><use xlink:href="#px" x="796" y="243"/>
    <use xlink:href="#px" x="706" y="273"/><use xlink:href="#px" x="736" y="273"/><use xlink:href="#px" x="766" y="273"/><use xlink:href="#px" x="796" y="273"/>
    <use xlink:href="#px" x="706" y="303"/><use xlink:href="#px" x="736" y="303"/><use xlink:href="#px" x="766" y="303"/><use xlink:href="#px" x="796" y="303"/>
  </g>
  <!-- (0,0) marker -->
  <text x="718" y="230" class="mono" font-size="9" fill="#0b0f14" text-anchor="middle" font-weight="700">0,0</text>
  <text x="740" y="356" class="mono t2" font-size="10" text-anchor="middle">serpentine · DIN at (0,0)</text>

  <!-- ===== capacitor ===== -->
  <path class="wire w5v" d="M878,100 V258"/>
  <path class="wire wgnd" d="M878,440 V276"/>
  <line x1="864" y1="260" x2="892" y2="260" stroke="#e6edf3" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M864,278 Q878,266 892,278" fill="none" stroke="#e6edf3" stroke-width="2.4" stroke-linecap="round"/>
  <text x="858" y="252" class="mono" font-size="12" fill="#FF6B6B" text-anchor="end">+</text>
  <text x="900" y="256" class="mono t1" font-size="11">C1</text>
  <text x="900" y="290" class="mono t1" font-size="11">1000 µF</text>
  <text x="900" y="304" class="mono t2" font-size="9.5">≥ 6.3 V electro.</text>
  <text x="900" y="317" class="mono t2" font-size="9.5">next to matrix</text>

  <!-- ===== legend ===== -->
  <g class="mono" font-size="11">
    <line x1="40" y1="493" x2="70" y2="493" class="wire w5v"/>
    <text x="78" y="497" fill="#FF6B6B">+5 V</text>
    <line x1="140" y1="493" x2="170" y2="493" class="wire wgnd"/>
    <text x="178" y="497" fill="#8b949e">GND</text>
    <line x1="240" y1="493" x2="270" y2="493" class="wire wdat"/>
    <text x="278" y="497" fill="#6EE7F9">DATA (GPIO4 → DIN)</text>
    <rect x="432" y="488" width="8" height="8" class="pad"/>
    <text x="446" y="497" fill="#8b949e">solder pad</text>
  </g>
  <text x="960" y="497" class="mono t2" font-size="10.5" text-anchor="end">common ground · protocol v2 · TCP 7777</text>
</svg>
